<h2>Add Task</h2>

<div>
  <label>Employee Name</label>
  <input type="text" [(ngModel)]="employeeName" />
</div>

<div>
  <label>Task</label>
  <input type="text" [(ngModel)]="taskTitle" />
</div>

<div>
  <label>Priority</label>
  <select [(ngModel)]="priority">   
    <option value="Low">Low</option>
    <option value="Medium">Medium</option>
    <option value="High">High</option>
  </select>
</div>

<button (click)="addTask()" [disabled]="!employeeName || !taskTitle">Add Task</button>
