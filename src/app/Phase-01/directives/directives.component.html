<div>
  <h3>Directives -- ngClass</h3>

  <p [ngClass]="{ active: isActive }">This text turns green when active</p>

  <button (click)="toggle()">Toggle</button>
</div>

<div>
  <h2>Products</h2>

  <div *ngIf="isAvailable">
    <div *ngFor="let product of products">
      <h3>{{ product.name }}</h3>

      <p>₹{{ product.price }}</p>
    </div>
  </div>
</div>
